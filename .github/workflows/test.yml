name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -v
      - run: node --test test_ui.mjs
      - run: node --input-type=module --check < gnome-extension/extension.js
      - run: node --input-type=module --check < gnome-extension/prefs.js
      - run: glib-compile-schemas --strict --dry-run gnome-extension/schemas
